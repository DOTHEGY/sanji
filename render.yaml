services:
  - type: web
    name: sanji-workspace
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: sanji-data
      mountPath: /var/data/sanji
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /var/data/sanji
      - key: SANJI_ENCRYPTION_KEY
        generateValue: true
      - key: SANJI_SETUP_TOKEN
        generateValue: true
      - key: EMAIL_SENDING_ENABLED
        value: "false"
      - key: INSTAGRAM_SENDING_ENABLED
        value: "false"
