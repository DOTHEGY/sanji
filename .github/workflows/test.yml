name: Verify production workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:supabase
      - run: git diff --exit-code -- public/workspace supabase/dashboard public/setup public/connect
      - run: npx playwright install --with-deps chromium
      - run: |
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          npm test
