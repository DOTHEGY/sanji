name: YouTube email scheduler
on:
  schedule:
    # 10:00–11:55 and 15:00–16:55 Korea time. GitHub may start workflows late.
    - cron: '*/5 1-2,6-7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Health only or the approved 54-row Nov 12 batch (expires 18:00 KST)"
        type: choice
        default: health
        required: true
        options:
          - health
          - approved-nov12-54
permissions:
  contents: read
  id-token: write
concurrency:
  group: youtube-manual-scheduler
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check due work
        if: github.event_name == 'schedule'
        run: python3 scripts/trigger-youtube-scheduler.py
      - name: Check authentication without processing work
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'approved-nov12-54'
        run: python3 scripts/trigger-youtube-scheduler.py --health

      - name: Process only the approved November 12 reservation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'approved-nov12-54'
        run: python3 scripts/trigger-youtube-scheduler.py --approved-batch
